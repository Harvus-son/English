<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Start — Interactive English Learning</title>
<style>
:root{
 --bg:#f5f7fb;--panel:#fff;--panel2:#eef2f8;--text:#172033;--muted:#68738a;
 --primary:#5b67f1;--primary2:#7c5cff;--good:#18a66a;--bad:#e24d67;--border:#e3e7ef;
 --shadow:0 12px 35px rgba(31,42,68,.08);--radius:22px;
}
body.dark{--bg:#0e1320;--panel:#151b2a;--panel2:#1c2435;--text:#f2f5fb;--muted:#9aa5ba;--border:#2b3549;--shadow:0 15px 40px rgba(0,0,0,.25)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,rgba(91,103,241,.12),transparent 30%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
button,input{font:inherit}button{border:0;cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:250px;padding:22px;position:fixed;inset:0 auto 0 0;background:rgba(255,255,255,.72);backdrop-filter:blur(18px);border-right:1px solid var(--border);z-index:5}
.dark .sidebar{background:rgba(21,27,42,.78)}.brand{display:flex;gap:12px;align-items:center;font-weight:900;font-size:21px;margin-bottom:28px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 10px 25px rgba(91,103,241,.3)}
.nav{display:grid;gap:7px}.nav button{padding:12px 14px;text-align:left;background:transparent;color:var(--muted);border-radius:14px;font-weight:700}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}.side-bottom{position:absolute;bottom:20px;left:22px;right:22px}.main{margin-left:250px;width:calc(100% - 250px);padding:28px;max-width:1500px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.top-actions{display:flex;gap:10px}.iconbtn,.secondary{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:13px}.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:12px 17px;border-radius:14px;font-weight:800;box-shadow:0 9px 22px rgba(91,103,241,.25)}.primary:disabled{opacity:.5;cursor:not-allowed}.hero{background:linear-gradient(135deg,#5b67f1,#7c5cff);color:white;border-radius:28px;padding:28px;box-shadow:0 18px 40px rgba(91,103,241,.22);display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{margin:0 0 8px;font-size:32px}.hero p{margin:0;opacity:.9}.hero-art{font-size:70px}.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(5,minmax(0,1fr));margin:18px 0}.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}.stat .num{font-size:27px;font-weight:900;margin-top:5px}.muted{color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:26px 0 13px}.section-title h2{margin:0;font-size:21px}.progress{height:10px;background:var(--panel2);border-radius:20px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:20px}.lesson-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.lesson{transition:.2s}.lesson:hover{transform:translateY(-3px)}.lesson .emoji{font-size:34px}.lesson h3{margin:10px 0 5px}.tag{display:inline-flex;padding:5px 9px;border-radius:99px;background:var(--panel2);font-size:12px;font-weight:800;color:var(--muted)}.locked{opacity:.58}.path{display:grid;gap:13px}.path-item{display:flex;align-items:center;gap:15px;padding:16px;border:1px solid var(--border);border-radius:18px;background:var(--panel)}.path-icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--panel2);font-size:24px}.path-item.done .path-icon{background:rgba(24,166,106,.12)}.path-item.current{border-color:rgba(91,103,241,.5);box-shadow:0 0 0 3px rgba(91,103,241,.07)}.two{grid-template-columns:1.3fr .7fr}.word-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.word-card{overflow:hidden;padding:0}.word-img{height:120px;display:grid;place-items:center;font-size:65px;background:linear-gradient(135deg,var(--panel2),rgba(91,103,241,.08))}.word-body{padding:16px}.word-body h3{margin:0 0 3px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.search{width:100%;padding:13px 15px;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:14px;outline:none}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:var(--panel2);color:var(--muted);padding:9px 12px;border-radius:12px;font-weight:700}.tabs button.active{background:var(--primary);color:#fff}.quiz{max-width:850px;margin:auto}.question{font-size:24px;font-weight:850;line-height:1.35}.answers{display:grid;gap:10px;margin-top:20px}.answer{padding:15px 16px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:15px;text-align:left;font-weight:750}.answer:hover{border-color:var(--primary)}.answer.correct{border-color:var(--good);background:rgba(24,166,106,.1)}.answer.wrong{border-color:var(--bad);background:rgba(226,77,103,.1)}.feedback{margin-top:16px;padding:13px;border-radius:14px;background:var(--panel2)}.center{text-align:center}.result-score{font-size:60px;font-weight:950}.choice-row{display:flex;gap:8px;flex-wrap:wrap}.word-chip{background:var(--panel2);color:var(--text);padding:11px 14px;border-radius:13px;font-weight:800}.builder-box{min-height:65px;border:2px dashed var(--border);border-radius:16px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.builder-box .word-chip{background:rgba(91,103,241,.12)}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px;border-bottom:1px solid var(--border);text-align:left}.achievement-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.achievement{display:flex;gap:13px;align-items:center}.badge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--panel2);font-size:25px}.earned .badge{background:rgba(255,193,7,.15)}.toast{position:fixed;right:22px;bottom:22px;background:var(--text);color:var(--bg);padding:14px 18px;border-radius:15px;z-index:20;box-shadow:var(--shadow);animation:pop .25s}.hidden{display:none!important}@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}.lesson-grid,.word-grid{grid-template-columns:repeat(2,1fr)}.achievement-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.sidebar{width:100%;height:68px;bottom:0;top:auto;padding:8px 10px;border-right:0;border-top:1px solid var(--border)}.brand,.side-bottom{display:none}.nav{display:flex;justify-content:space-around}.nav button{font-size:0;padding:10px}.nav button::first-letter{font-size:21px}.main{margin:0 0 68px;width:100%;padding:17px}.topbar h1{font-size:22px}.hero{padding:21px}.hero h1{font-size:26px}.hero-art{font-size:48px}.stats{grid-template-columns:repeat(2,1fr)}.lesson-grid,.word-grid,.achievement-grid,.two{grid-template-columns:1fr}.question{font-size:20px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="logo">EN</div> English Start</div>
 <nav class="nav" id="nav">
  <button data-page="dashboard">🏠 Dashboard</button><button data-page="learning">📚 Learning</button><button data-page="exercises">🧩 Exercises</button><button data-page="dictionary">📖 Dictionary</button><button data-page="review">🔄 Review</button><button data-page="achievements">🏆 Achievements</button><button data-page="progress">📊 Progress</button><button data-page="settings">⚙️ Settings</button>
 </nav>
 <div class="side-bottom"><div class="card" style="padding:14px"><b>🔥 <span id="sideStreak">0</span> day streak</b><div class="muted" style="font-size:12px;margin-top:4px">Keep learning every day.</div></div></div>
</aside>
<main class="main">
 <div class="topbar"><h1 id="pageTitle">Dashboard</h1><div class="top-actions"><button class="iconbtn" onclick="toggleTheme()">🌙</button><button class="primary" onclick="startTest()">🧠 Take test</button></div></div>
 <div id="appView"></div>
</main>
</div>
<div id="toast" class="toast hidden"></div>

<script>
const alphabet=[
['A','/eɪ/','Apple','Яблоко','🍎'],['B','/biː/','Ball','Мяч','⚽'],['C','/siː/','Cat','Кошка','🐱'],['D','/diː/','Dog','Собака','🐶'],['E','/iː/','Egg','Яйцо','🥚'],['F','/ɛf/','Fish','Рыба','🐟'],['G','/dʒiː/','Girl','Девочка','👧'],['H','/eɪtʃ/','House','Дом','🏠'],['I','/aɪ/','Ice','Лёд','🧊'],['J','/dʒeɪ/','Juice','Сок','🧃'],['K','/keɪ/','Key','Ключ','🔑'],['L','/ɛl/','Lion','Лев','🦁'],['M','/ɛm/','Moon','Луна','🌙'],['N','/ɛn/','Nose','Нос','👃'],['O','/oʊ/','Orange','Апельсин','🍊'],['P','/piː/','Pizza','Пицца','🍕'],['Q','/kjuː/','Queen','Королева','👑'],['R','/ɑːr/','Robot','Робот','🤖'],['S','/ɛs/','Sun','Солнце','☀️'],['T','/tiː/','Tree','Дерево','🌳'],['U','/juː/','Umbrella','Зонт','☂️'],['V','/viː/','Van','Фургон','🚐'],['W','/ˈdʌbəljuː/','Water','Вода','💧'],['X','/ɛks/','Xylophone','Ксилофон','🎵'],['Y','/waɪ/','Yellow','Жёлтый','💛'],['Z','/ziː/','Zebra','Зебра','🦓']
];
const words=[
['dog','собака','/dɒɡ/','Animals','🐶','This is a dog.'],['cat','кошка','/kæt/','Animals','🐱','The cat is small.'],['apple','яблоко','/ˈæpəl/','Food','🍎','I eat an apple.'],['pizza','пицца','/ˈpiːtsə/','Food','🍕','I like pizza.'],['mother','мама','/ˈmʌðər/','Family','👩','My mother is kind.'],['blue','синий','/bluː/','Colors','🔵','The car is blue.'],['five','пять','/faɪv/','Numbers','5️⃣','I have five books.'],['shirt','рубашка','/ʃɜːrt/','Clothes','👕','This shirt is new.'],['house','дом','/haʊs/','Home','🏠','This is my house.'],['book','книга','/bʊk/','School','📘','I read a book.'],['tree','дерево','/triː/','Nature','🌳','The tree is tall.'],['car','машина','/kɑːr/','Transport','🚗','The car is fast.'],['teacher','учитель','/ˈtiːtʃər/','Jobs','🧑‍🏫','The teacher helps me.'],['hand','рука','/hænd/','Body','✋','Raise your hand.'],['phone','телефон','/foʊn/','Everyday objects','📱','My phone is here.'],['school','школа','/skuːl/','School','🏫','I go to school.'],['water','вода','/ˈwɔːtər/','Food','💧','I drink water.'],['friend','друг','/frend/','Family','🧑‍🤝‍🧑','He is my friend.']
];
const lessons=[
{id:'alphabet',icon:'🅰️',title:'Alphabet',level:'Beginner',desc:'Learn all 26 letters, sounds and examples.'},
{id:'words',icon:'📚',title:'Basic Words',level:'Beginner',desc:'Build your first everyday vocabulary.'},
{id:'sentences',icon:'🧩',title:'Sentence Builder',level:'Elementary',desc:'Learn Subject + Verb + Object.'},
{id:'articles',icon:'🔤',title:'Articles',level:'Elementary',desc:'Practice a, an and the.'},
{id:'spelling',icon:'✍️',title:'Spelling',level:'Elementary',desc:'Train spelling and Listen & Type.'},
{id:'present',icon:'⏰',title:'Present Simple',level:'Elementary',desc:'Talk about routines and facts.'},
{id:'continuous',icon:'⏱️',title:'Present Continuous',level:'Elementary',desc:'Talk about actions happening now.'},
{id:'past',icon:'🕰️',title:'Past Simple',level:'Pre-Intermediate',desc:'Talk about completed past actions.'},
{id:'future',icon:'🚀',title:'Future Simple',level:'Pre-Intermediate',desc:'Talk about future plans and predictions.'}
];
const tests=[
 {q:'I ___ a student.',a:['am','is','are','be'],c:0,e:'With I, use “am”.'},
 {q:'How do you translate “Apple”?',a:['Яблоко','Апельсин','Банан','Груша'],c:0,e:'Apple means яблоко.'},
 {q:'Choose the correct sentence.',a:['John is a student.','John a student is.','Is John student a.','John student a is.'],c:0,e:'Basic order: Subject + Verb + Object/Complement.'},
 {q:'Choose the article: I have ___ apple.',a:['a','an','the','no article'],c:1,e:'Use “an” before a vowel sound.'},
 {q:'She ___ every day.',a:['work','works','working','is work'],c:1,e:'Present Simple: she/he/it + verb-s.'},
 {q:'What is “dog”?',a:['Собака','Кошка','Дом','Рыба'],c:0,e:'Dog means собака.'},
 {q:'Choose the correct spelling.',a:['Aple','Apple','Appel','Appl'],c:1,e:'The correct spelling is Apple.'},
 {q:'They ___ playing now.',a:['is','am','are','be'],c:2,e:'They + are in Present Continuous.'},
 {q:'Choose the correct future form.',a:['I will play.','I will played.','I playing.','I plays tomorrow.'],c:0,e:'Future Simple uses will + base verb.'},
 {q:'“Good morning” means…',a:['Добрый вечер','Доброе утро','Спокойной ночи','До свидания'],c:1,e:'Good morning = Доброе утро.'}
];
const tenseData={
present:{title:'Present Simple',icon:'⏰',explain:'Use it for routines, habits and facts.',structure:'I/You/We/They + verb · He/She/It + verb-s',examples:['I play games.','She works at school.','They live in Germany.'],qs:[['She ___ to school every day.',['go','goes','going'],1],['They ___ English.',['study','studies','studying'],0]]},
continuous:{title:'Present Continuous',icon:'⏱️',explain:'Use it for actions happening now.',structure:'am / is / are + verb-ing',examples:['I am reading.','She is working.','They are playing.'],qs:[['I ___ reading now.',['am','is','are'],0],['They ___ playing.',['is','am','are'],2]]},
past:{title:'Past Simple',icon:'🕰️',explain:'Use it for completed actions in the past.',structure:'Subject + past form (often verb + ed)',examples:['I played yesterday.','She worked last week.'],qs:[['I ___ yesterday.',['play','played','playing'],1],['She ___ at home.',['stayed','stay','staying'],0]]},
future:{title:'Future Simple',icon:'🚀',explain:'Use it for future actions and predictions.',structure:'Subject + will + base verb',examples:['I will play tomorrow.','She will work later.'],qs:[['I ___ help you.',['will','am','did'],0],['They will ___ tomorrow.',['played','play','playing'],1]]}
};
const achievements=[
['first','🏆','First Lesson','Complete your first lesson.'],['words10','📚','10 Words','Learn 10 words.'],['words100','💯','100 Words','Learn 100 words.'],['grammar','🧠','Grammar Starter','Complete a grammar lesson.'],['streak','🔥','7 Day Streak','Study for 7 days.'],['perfect','⭐','Perfect Test','Get 10/10 on the entry test.'],['alphabet','🅰️','Alphabet Master','Complete the alphabet lesson.']
];
let state=JSON.parse(localStorage.getItem('englishStartV2')||'null')||{
xp:0,level:'Beginner',correct:0,answers:0,lessons:0,wordsKnown:[],myWords:[],review:[],completed:[],streak:0,lastDay:null,theme:'light',testDone:false,startedAt:null,daily:{date:null,words:0,ex:0,review:0}
};
function save(){localStorage.setItem('englishStartV2',JSON.stringify(state))}
function xp(n){state.xp+=n;save();toast('+'+n+' XP ✨')}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.add('hidden'),2200)}
function speak(s){if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}else toast('Speech is not supported in this browser.')}
function today(){return new Date().toISOString().slice(0,10)}
function updateStreak(){let d=today();if(state.lastDay!==d){if(state.lastDay){let old=new Date(state.lastDay),now=new Date(d),diff=Math.round((now-old)/86400000);state.streak=diff===1?state.streak+1:1}else state.streak=1;state.lastDay=d;save()}}
updateStreak(); document.body.classList.toggle('dark',state.theme==='dark');
function setPage(p){window.scrollTo(0,0);document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('pageTitle').textContent=p==='dashboard'?'Dashboard':p[0].toUpperCase()+p.slice(1);({dashboard:dashboard,learning:learning,exercises:exercises,dictionary:dictionary,review:review,achievements:achievementsPage,progress:progressPage,settings:settings}[p]||dashboard)(); }
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';document.body.classList.toggle('dark',state.theme==='dark');save()}
function startTest(){renderTest(0,0,[])}
function dashboard(){
 const p=Math.min(100,Math.round((state.xp%500)/5)), learned=state.wordsKnown.length;
 const current=lessons.find(x=>!state.completed.includes(x.id))||lessons[lessons.length-1];
 document.getElementById('appView').innerHTML=`
 <section class="hero"><div><h1>Hello! 👋</h1><p>Готов изучать английский? Начни с теста или продолжи обучение.</p><div class="actions"><button class="primary" onclick="startTest()">Проверить знания</button><button class="secondary" onclick="setPage('learning')">Открыть Learning Path</button></div></div><div class="hero-art">📚</div></section>
 <div class="grid stats">
  ${stat('🎯','My Level',state.level)}${stat('📘','Lessons',state.lessons)}${stat('✅','Correct',state.correct)}${stat('🔥','Streak',state.streak+' days')}${stat('📖','Words',learned)}
 </div>
 <div class="grid two"><div class="card"><div class="section-title"><h2>Continue learning</h2><span class="tag">${current.level}</span></div><div style="font-size:40px">${current.icon}</div><h2>${current.title}</h2><p class="muted">${current.desc}</p><div class="progress"><i style="width:${state.completed.includes(current.id)?100:25}%"></i></div><div class="actions"><button class="primary" onclick="openLesson('${current.id}')">Continue →</button></div></div>
 <div class="card"><div class="section-title"><h2>Today's Challenge</h2><span class="tag">+50 XP</span></div><p>Learn 5 new words and complete 10 exercises.</p><div class="progress"><i style="width:${Math.min(100,((state.daily.words+state.daily.ex)/15)*100)}%"></i></div><p class="muted">${state.daily.words}/5 words · ${state.daily.ex}/10 exercises</p><button class="secondary" onclick="setPage('exercises')">Practice now</button></div></div>
 <div class="section-title"><h2>Learning Path</h2><button class="secondary" onclick="setPage('learning')">View all</button></div><div class="grid lesson-grid">${lessons.slice(0,6).map(lessonCard).join('')}</div>`;
 document.getElementById('sideStreak').textContent=state.streak;
}
function stat(i,n,v){return `<div class="card stat"><div class="muted">${i} ${n}</div><div class="num">${v}</div></div>`}
function lessonCard(x){let done=state.completed.includes(x.id);return `<div class="card lesson ${done?'':'current'}"><div class="emoji">${x.icon}</div><span class="tag">${x.level}</span><h3>${x.title}</h3><p class="muted">${x.desc}</p><button class="primary" onclick="openLesson('${x.id}')">${done?'Review':'Start'} →</button></div>`}
function learning(){
 document.getElementById('appView').innerHTML=`<div class="card"><h2>English Start Learning Path</h2><p class="muted">Проходи темы последовательно. Завершенные уроки дают XP и открывают следующий материал.</p></div><div class="path" style="margin-top:16px">${lessons.map((x,i)=>{let done=state.completed.includes(x.id),lock=i>0&&!state.completed.includes(lessons[i-1].id);return `<div class="path-item ${done?'done':''} ${!lock&&!done?'current':''} ${lock?'locked':''}"><div class="path-icon">${done?'✅':x.icon}</div><div style="flex:1"><b>${x.title}</b><div class="muted">${x.level} · ${x.desc}</div></div><button class="${lock?'secondary':'primary'}" ${lock?'disabled':''} onclick="openLesson('${x.id}')">${lock?'🔒 Locked':done?'Review':'Start'}</button></div>`}).join('')}</div>`;
}
function openLesson(id){
 if(id==='alphabet') return alphabetPage();
 if(id==='words') return wordsPage();
 if(id==='sentences') return sentencePage();
 if(id==='articles') return articlesPage();
 if(id==='spelling') return spellingPage();
 if(tenseData[id]) return tensePage(id);
}
function complete(id){
 if(!state.completed.includes(id)){state.completed.push(id);state.lessons++;xp(50);if(id==='alphabet'){}}
 updateStreak();save();checkAchievements();toast('Lesson completed! +50 XP');
}
function alphabetPage(){
 document.getElementById('pageTitle').textContent='Alphabet';
 document.getElementById('appView').innerHTML=`<div class="card"><div class="section-title"><div><h2>English Alphabet — A to Z</h2><p class="muted">Нажми Listen, чтобы услышать букву и пример.</p></div><span class="tag">26 letters</span></div><div class="grid word-grid">${alphabet.map(a=>`<div class="card word-card"><div class="word-img">${a[4]}</div><div class="word-body"><h3>${a[0]} a</h3><div class="muted">${a[1]}</div><p><b>${a[2]}</b> — ${a[3]}</p><button class="secondary" onclick="speak('${a[0]}, ${a[2]}')">🔊 Listen</button></div></div>`).join('')}</div><div class="actions"><button class="primary" onclick="complete('alphabet');setPage('learning')">Finish Alphabet +50 XP</button><button class="secondary" onclick="renderTopicTest('alphabet')">Alphabet Test</button></div></div>`;
}
function wordsPage(filter='All'){
 const cats=['All',...new Set(words.map(w=>w[3]))];document.getElementById('pageTitle').textContent='Words';
 document.getElementById('appView').innerHTML=`<div class="card"><input class="search" placeholder="Search English words..." oninput="filterWords(this.value)"><div class="tabs" style="margin-top:14px">${cats.map(c=>`<button class="${filter===c?'active':''}" onclick="wordsPage('${c}')">${c}</button>`).join('')}</div><div id="wordsList" class="grid word-grid">${wordCards(filter)}</div></div>`;
}
function wordCards(filter,q=''){return words.filter(w=>(filter==='All'||w[3]===filter)&&((w[0]+' '+w[1]).toLowerCase().includes(q.toLowerCase()))).map(w=>{let known=state.wordsKnown.includes(w[0]),fav=state.myWords.includes(w[0]);return `<div class="card word-card"><div class="word-img">${w[4]}</div><div class="word-body"><h3>${w[0].toUpperCase()}</h3><div class="muted">${w[1]} · ${w[2]}</div><p>${w[5]}</p><div class="actions"><button class="secondary" onclick="speak('${w[0]}')">🔊</button><button class="${known?'secondary':'primary'}" onclick="knowWord('${w[0]}')">${known?'✓ Known':'Я знаю'}</button><button class="secondary" onclick="favWord('${w[0]}')">${fav?'⭐':'☆'}</button></div></div></div>`}).join('')}
function filterWords(q){document.getElementById('wordsList').innerHTML=wordCards('All',q)}
function knowWord(w){if(!state.wordsKnown.includes(w)){state.wordsKnown.push(w);state.daily.words++;xp(5);save();checkAchievements();toast('New word learned! +5 XP')}else toast('Already learned')}
function favWord(w){if(state.myWords.includes(w))state.myWords=state.myWords.filter(x=>x!==w);else state.myWords.push(w);save();wordsPage()}
function sentences(){
 document.getElementById('pageTitle').textContent='Sentence Builder';
 document.getElementById('appView').innerHTML=`<div class="quiz card"><span class="tag">Level 1</span><h2>Build the sentence</h2><p class="muted">Нажимай слова в правильном порядке.</p><div class="builder-box" id="built"></div><div class="choice-row" id="chips">${['I','like','pizza'].map(w=>`<button class="word-chip" onclick="addChip(this,'${w}')">${w}</button>`).join('')}</div><div class="actions"><button class="primary" onclick="checkSentence()">Check</button><button class="secondary" onclick="sentences()">Reset</button></div><div id="sentenceFeedback"></div></div>`;
}
let built=[];
function addChip(btn,w){if(btn.disabled)return;built.push(w);btn.disabled=true;document.getElementById('built').insertAdjacentHTML('beforeend',`<span class="word-chip">${w}</span>`)}
function checkSentence(){let ok=built.join(' ')==='I like pizza';document.getElementById('sentenceFeedback').innerHTML=`<div class="feedback">${ok?'✅ Правильно! Subject + Verb + Object.':'❌ Попробуй еще раз. Правильный порядок: I → like → pizza.'}</div>`;if(ok){state.correct++;state.answers++;state.daily.ex++;xp(10);complete('sentences');save();}}
function sentencePage(){sentences()}
function articlesPage(){
 document.getElementById('pageTitle').textContent='Articles';
 document.getElementById('appView').innerHTML=`<div class="grid lesson-grid"><div class="card"><h2>🔤 A / An / The</h2><p><b>a</b> — перед согласным звуком: <b>a cat</b> 🐱</p><p><b>an</b> — перед гласным звуком: <b>an apple</b> 🍎</p><p><b>the</b> — когда говорим о конкретном предмете: <b>the sun</b> ☀️</p></div><div class="card"><h2>Quick practice</h2><p class="question" style="font-size:19px">I have ___ apple.</p><div class="answers">${['a','an','the'].map((x,i)=>`<button class="answer" onclick="articleAnswer(${i},this)">${x}</button>`).join('')}</div><div id="articleFeedback"></div></div></div>`;
}
function articleAnswer(i,b){document.querySelectorAll('.answer').forEach(x=>x.disabled=true);let ok=i===1;b.classList.add(ok?'correct':'wrong');document.getElementById('articleFeedback').innerHTML=`<div class="feedback">${ok?'✅ Correct! “an” is used before the vowel sound in apple.':'❌ Not this time. The correct answer is “an”.'}</div>`;state.answers++;if(ok){state.correct++;xp(10)}state.daily.ex++;save()}
function spellingPage(){
 document.getElementById('pageTitle').textContent='Spelling';
 document.getElementById('appView').innerHTML=`<div class="quiz card"><span class="tag">Spelling</span><h2>What is the correct spelling?</h2><div class="word-img" style="border-radius:18px;margin:15px 0">🍎</div><div class="answers">${['Aple','Apple','Appel','Appl'].map((x,i)=>`<button class="answer" onclick="spellChoice(${i},this)">${x}</button>`).join('')}</div><hr style="border:0;border-top:1px solid var(--border);margin:25px 0"><h3>Listen & Type</h3><button class="secondary" onclick="speak('apple')">🔊 Listen</button><input id="spellInput" class="search" style="margin-top:10px" placeholder="Type the word..."><button class="primary" style="margin-top:10px" onclick="spellInput()">Check</button><div id="spellFeedback"></div></div>`;
}
function spellChoice(i,b){document.querySelectorAll('.answer').forEach(x=>x.disabled=true);let ok=i===1;b.classList.add(ok?'correct':'wrong');document.getElementById('spellFeedback').innerHTML=`<div class="feedback">${ok?'✅ Correct!':'❌ Correct spelling: Apple.'}</div>`;state.answers++;if(ok){state.correct++;xp(10)}state.daily.ex++;save()}
function spellInput(){let v=document.getElementById('spellInput').value.trim().toLowerCase(),ok=v==='apple';document.getElementById('spellFeedback').innerHTML=`<div class="feedback">${ok?'✅ Correct!':'❌ Try “apple”.'}</div>`;if(ok){state.correct++;xp(10)}state.answers++;state.daily.ex++;save()}
function tensePage(id){
 let d=tenseData[id];document.getElementById('pageTitle').textContent=d.title;
 document.getElementById('appView').innerHTML=`<div class="grid two"><div class="card"><div style="font-size:42px">${d.icon}</div><h2>${d.title}</h2><p>${d.explain}</p><div class="card" style="background:var(--panel2)"><b>Structure</b><p>${d.structure}</p></div><h3>Examples</h3>${d.examples.map(x=>`<p>🔹 <b>${x}</b> <button class="secondary" onclick="speak('${x}')">🔊</button></p>`).join('')}</div><div class="card"><h2>Mini test</h2>${d.qs.map((q,i)=>`<div style="margin-bottom:25px"><b>${i+1}. ${q[0]}</b><div class="answers">${q[1].map((a,j)=>`<button class="answer tenseAns" onclick="tenseAnswer(this,${j},${q[2]},'${id}')">${a}</button>`).join('')}</div></div>`).join('')}<button class="primary" onclick="complete('${id}');setPage('learning')">Finish lesson</button></div></div>`;
}
function tenseAnswer(btn,j,c,id){if(btn.parentElement.dataset.done)return;btn.parentElement.dataset.done='1';let ok=j===c;btn.classList.add(ok?'correct':'wrong');state.answers++;if(ok){state.correct++;xp(10)}state.daily.ex++;save()}
function dictionary(){
 document.getElementById('pageTitle').textContent='My Dictionary';
 document.getElementById('appView').innerHTML=`<div class="card"><input id="dictSearch" class="search" placeholder="Search your dictionary..." oninput="renderDict()"><div id="dictList" style="margin-top:15px"></div></div>`;
 renderDict();
}
function renderDict(){let q=(document.getElementById('dictSearch')?.value||'').toLowerCase();let list=words.filter(w=>(w[0]+' '+w[1]).toLowerCase().includes(q));document.getElementById('dictList').innerHTML=list.map(w=>`<div class="path-item"><div class="path-icon">${w[4]}</div><div style="flex:1"><b>${w[0].toUpperCase()}</b><div class="muted">${w[1]} · ${w[2]} · ${w[3]}</div><div>${w[5]}</div></div><button class="secondary" onclick="speak('${w[0]}')">🔊</button></div>`).join('')}
function review(){
 document.getElementById('pageTitle').textContent='Review';
 let list=state.review.length?words.filter(w=>state.review.includes(w[0])):words.slice(0,6);
 document.getElementById('appView').innerHTML=`<div class="card"><h2>🔄 Smart Review</h2><p class="muted">Сложные слова можно добавить сюда и повторять чаще.</p><div class="grid word-grid">${list.map(w=>`<div class="card word-card"><div class="word-img">${w[4]}</div><div class="word-body"><h3>${w[0]}</h3><p>${w[1]}</p><div class="actions"><button class="secondary" onclick="speak('${w[0]}')">🔊</button><button class="secondary" onclick="reviewRate('${w[0]}','hard')">😕 Сложно</button><button class="secondary" onclick="reviewRate('${w[0]}','easy')">😎 Легко</button></div></div></div>`).join('')}</div></div>`;
}
function reviewRate(w,r){if(r==='hard'&&!state.review.includes(w))state.review.push(w);if(r==='easy')state.review=state.review.filter(x=>x!==w);state.daily.review++;xp(3);save();review()}
function exercises(){document.getElementById('pageTitle').textContent='Exercises';document.getElementById('appView').innerHTML=`<div class="grid lesson-grid">${[['🧩','Sentence Builder','sentences'],['🔤','Articles','articles'],['✍️','Spelling','spelling'],['⏰','Present Simple','present'],['⏱️','Present Continuous','continuous'],['🕰️','Past Simple','past'],['🚀','Future Simple','future']].map(x=>`<div class="card lesson"><div class="emoji">${x[0]}</div><h3>${x[1]}</h3><p class="muted">Interactive exercises and instant feedback.</p><button class="primary" onclick="openLesson('${x[2]}')">Practice →</button></div>`).join('')}</div>`}
function achievementsPage(){
 document.getElementById('pageTitle').textContent='Achievements';checkAchievements();
 document.getElementById('appView').innerHTML=`<div class="grid achievement-grid">${achievements.map(a=>{let e=isAch(a[0]);return `<div class="card achievement ${e?'earned':''}"><div class="badge">${a[1]}</div><div><b>${a[2]}</b><div class="muted">${a[3]}</div>${e?'<span class="tag">Unlocked</span>':'<span class="tag">Locked</span>'}</div></div>`}).join('')}</div>`;
}
function isAch(id){if(id==='first')return state.lessons>0;if(id==='words10')return state.wordsKnown.length>=10;if(id==='words100')return state.wordsKnown.length>=100;if(id==='grammar')return ['articles','present','continuous','past','future'].some(x=>state.completed.includes(x));if(id==='streak')return state.streak>=7;if(id==='perfect')return state.testDone&&state.lastTest===10;if(id==='alphabet')return state.completed.includes('alphabet');return false}
function checkAchievements(){if(isAch('perfect')&&!state.achPerfect){state.achPerfect=true;toast('Achievement unlocked! ⭐ Perfect Test')}save()}
function progressPage(){
 let acc=state.answers?Math.round(state.correct/state.answers*100):0, xpIn=state.xp%500, lvl=Math.floor(state.xp/500)+1;
 document.getElementById('pageTitle').textContent='My Progress';
 document.getElementById('appView').innerHTML=`<div class="grid stats">${stat('🎯','Level',state.level)}${stat('✨','XP',state.xp)}${stat('📚','Words',state.wordsKnown.length)}${stat('🎓','Lessons',state.lessons)}${stat('🎯','Accuracy',acc+'%')}</div><div class="grid two"><div class="card"><h2>Level ${lvl}</h2><p class="muted">${xpIn} / 500 XP to next level</p><div class="progress"><i style="width:${xpIn/5}%"></i></div><h3>Topic progress</h3>${lessons.map((l,i)=>{let v=state.completed.includes(l.id)?100:(i===state.completed.length?25:0);return `<p><b>${l.title}</b> <span class="muted">${v}%</span></p><div class="progress"><i style="width:${v}%"></i></div>`}).join('')}</div><div class="card"><h2>Learning streak 🔥</h2><div class="result-score">${state.streak}</div><p class="muted">days in a row</p><h3>Stats</h3><p>Correct answers: <b>${state.correct}</b></p><p>Total answers: <b>${state.answers}</b></p><p>Saved My Words: <b>${state.myWords.length}</b></p></div></div>`;
}
function settings(){
 document.getElementById('pageTitle').textContent='Settings';
 document.getElementById('appView').innerHTML=`<div class="card"><h2>⚙️ Settings</h2><p>Theme</p><button class="secondary" onclick="toggleTheme();settings()">${state.theme==='dark'?'☀️ Light Mode':'🌙 Dark Mode'}</button><hr style="border:0;border-top:1px solid var(--border);margin:22px 0"><h3>Local data</h3><p class="muted">Прогресс хранится в LocalStorage этого браузера.</p><button class="secondary" onclick="if(confirm('Reset all progress?')){localStorage.removeItem('englishStartV2');location.reload()}">Reset progress</button></div>`;
}
function renderTest(i,score,results){
 document.getElementById('pageTitle').textContent='Placement Test';
 if(i>=tests.length){state.testDone=true;state.lastTest=score;state.correct+=score;state.answers+=tests.length;state.level=score<=3?'Beginner':score<=6?'Elementary':score<=8?'Pre-Intermediate':'Strong Start';xp(100);save();checkAchievements();let next=score<=3?'alphabet':score<=6?'words':'sentences';document.getElementById('appView').innerHTML=`<div class="card quiz center"><div class="result-score">${score}/10</div><h2>Your starting level: ${state.level}</h2><p class="muted">Мы рекомендуем начать с темы <b>${lessons.find(x=>x.id===next).title}</b>.</p><div class="actions" style="justify-content:center"><button class="primary" onclick="openLesson('${next}')">Start recommended topic →</button><button class="secondary" onclick="setPage('dashboard')">Dashboard</button></div><hr style="border:0;border-top:1px solid var(--border);margin:25px 0"><h3>Test review</h3>${results.map((r,n)=>`<div class="feedback" style="text-align:left;margin:8px 0">${r.ok?'✅':'❌'} <b>Q${n+1}</b> — ${r.text}</div>`).join('')}</div>`;return}
 let t=tests[i];document.getElementById('appView').innerHTML=`<div class="card quiz"><div class="section-title"><span class="tag">Question ${i+1} / 10</span><span class="muted">${score} correct</span></div><div class="progress"><i style="width:${i*10}%"></i></div><p class="question" style="margin-top:25px">${t.q}</p><div class="answers">${t.a.map((a,j)=>`<button class="answer" onclick="testAnswer(${i},${j},${score},this)">${a}</button>`).join('')}</div><div id="testFeedback"></div></div>`;
}
function testAnswer(i,j,score,b){document.querySelectorAll('.answer').forEach(x=>x.disabled=true);let t=tests[i],ok=j===t.c;b.classList.add(ok?'correct':'wrong');let ns=score+(ok?1:0);document.getElementById('testFeedback').innerHTML=`<div class="feedback">${ok?'✅ Correct!':'❌ Incorrect.'} ${t.e}</div><div class="actions"><button class="primary" onclick="renderTest(${i+1},${ns},window.testResults)">Next →</button></div>`;window.testResults=window.testResults||[];window.testResults.push({ok,text:t.q})}
function renderTopicTest(topic){
 let qs=topic==='alphabet'?[['Which letter comes after A?',['B','C','D'],0],['Which word starts with C?',['Dog','Cat','Apple'],1],['Which is the letter Z?',['Z','Y','X'],0]]:tests.slice(0,3).map(t=>[t.q,t.a,t.c]);
 let i=0,score=0;function q(){document.getElementById('appView').innerHTML=`<div class="quiz card"><span class="tag">${topic} test</span><h2>${qs[i][0]}</h2><div class="answers">${qs[i][1].map((a,j)=>`<button class="answer" onclick="this.disabled=true;this.classList.add(${j===qs[i][2]?'\\'correct\\'':'\\'wrong\\''});if(${j===qs[i][2]})score++;setTimeout(()=>{i++;i<qs.length?q():finish()},450)">${a}</button>`).join('')}</div></div>`}function finish(){xp(30);document.getElementById('appView').innerHTML=`<div class="card center"><div class="result-score">${score}/${qs.length}</div><h2>Topic test complete!</h2><button class="primary" onclick="setPage('learning')">Back to Learning</button></div>`}q();
}
function initDaily(){let d=today();if(state.daily.date!==d)state.daily={date:d,words:0,ex:0,review:0};save()}
initDaily();setPage('dashboard');
</script>
</body>
</html>
