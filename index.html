<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Start 2.0</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#0b1020;color:#eef2ff}
button,input,select{font:inherit}button{cursor:pointer;border:0}
.app{display:flex;min-height:100vh}.side{width:250px;background:#10172a;border-right:1px solid #26304b;padding:20px;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{font-size:23px;font-weight:800;margin-bottom:24px}.brand span{color:#6ea8fe}
.nav button{display:block;width:100%;text-align:left;background:transparent;color:#aeb8d0;padding:12px 14px;border-radius:12px;margin:4px 0}.nav button:hover,.nav button.active{background:#1b2742;color:white}
.main{margin-left:250px;width:calc(100% - 250px);padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.user{background:#17213a;padding:10px 14px;border-radius:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:#121b30;border:1px solid #263451;border-radius:20px;padding:20px;box-shadow:0 10px 30px #0003}.stat{font-size:30px;font-weight:800}.muted{color:#91a0bd}.accent{color:#72a7ff}.btn{background:#5d8cff;color:white;padding:11px 16px;border-radius:12px;font-weight:700}.btn.secondary{background:#202d49}.btn.success{background:#29966b}.btn.danger{background:#b84b5b}.actions{display:flex;gap:10px;flex-wrap:wrap}.bar{height:9px;background:#263451;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#6ea8fe;border-radius:99px}.topic{min-height:130px}.emoji{font-size:42px}.list{display:grid;gap:12px}.item{background:#18233b;border:1px solid #2b3958;padding:15px;border-radius:15px}.hidden{display:none}.page h1{margin-top:0}.options{display:grid;gap:10px;margin-top:16px}.options button{background:#1b2945;color:#eef2ff;padding:14px;border-radius:12px;text-align:left;border:1px solid #2a3a5c}.options button:hover{border-color:#6ea8fe}.tag{display:inline-block;padding:6px 9px;border-radius:9px;background:#20304f;color:#a9c8ff;font-size:12px;margin:3px}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modalbox{max-width:480px;width:100%;background:#121b30;border:1px solid #334466;border-radius:22px;padding:25px}.modalbox input,.modalbox select{width:100%;background:#0c1426;color:white;border:1px solid #344563;border-radius:12px;padding:12px;margin:7px 0 14px}.feedback{margin-top:15px;font-weight:700}.small{font-size:13px}.profile{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#263a63}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #293754;text-align:left}.search{width:100%;background:#0d1528;border:1px solid #30405f;color:white;padding:13px;border-radius:13px;margin-bottom:15px}
@media(max-width:900px){.side{width:210px}.main{margin-left:210px;width:calc(100% - 210px)}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.side{position:static;width:100%;height:auto}.app{display:block}.main{margin:0;width:100%;padding:16px}.grid,.grid2{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="login" class="modal">
  <div class="modalbox">
    <h1>English <span class="accent">Start</span></h1>
    <p class="muted">Учебная платформа с аккаунтами ученика и педагога.</p>
    <label>Логин</label><input id="loginName" placeholder="Введите логин">
    <label>Пароль</label><input id="loginPass" type="password" placeholder="Введите пароль">
    <button class="btn" style="width:100%" onclick="login()">Войти</button>
    <p id="loginMsg" class="feedback"></p>
    <p class="small muted">Демо: student / student123 · teacher / teacher123</p>
  </div>
</div>

<div class="app hidden" id="app">
<aside class="side">
 <div class="brand">English <span>Start</span> 2.0</div>
 <div class="nav" id="nav"></div>
 <button class="btn secondary" style="width:100%;margin-top:15px" onclick="logout()">Выйти</button>
</aside>
<main class="main">
 <div class="top"><div><div class="muted" id="roleText"></div><h2 id="pageTitle">Dashboard</h2></div><div class="user profile"><div class="avatar" id="avatar">S</div><span id="userName"></span></div></div>
 <section id="content"></section>
</main>
</div>

<script>
const accounts={
 student:{login:"student",pass:"student123",name:"Alex Student",role:"student"},
 teacher:{login:"teacher",pass:"teacher123",name:"Anna Teacher",role:"teacher"}
};
let current=null, state=JSON.parse(localStorage.getItem("englishStartState")||'{"xp":120,"words":8,"streak":3,"tests":2,"completed":[],"myWords":[]}');

const topics=[
 ["alphabet","🔤","Алфавит","A–Z, звуки и произношение"],
 ["vocabulary","🧠","Базовая лексика","Слова по темам и карточки"],
 ["numbers","🔢","Числа и даты","Числа, даты, время"],
 ["colors","🎨","Цвета","Описание предметов"],
 ["family","👨‍👩‍👧","Семья","Family vocabulary"],
 ["home","🏠","Дом","Комнаты и предметы"],
 ["school","🎒","Школа","School vocabulary"],
 ["food","🍎","Еда","Food & drinks"],
 ["animals","🐶","Животные","Animals"],
 ["body","🫶","Части тела","Body vocabulary"],
 ["sentence","🧩","Предложения","Порядок слов"],
 ["articles","📚","Артикли","A / An / The"],
 ["pronouns","👤","Местоимения","I, you, he, she, it..."],
 ["prepositions","📍","Предлоги","In, on, at, under..."],
 ["spelling","✍️","Орфография","Написание и диктанты"],
 ["present","🟢","Present Simple","Привычки и факты"],
 ["continuous","🔵","Present Continuous","Действия сейчас"],
 ["past","🟠","Past Simple","Прошлое"],
 ["future","🟣","Future Simple","Будущее"],
 ["questions","❓","Вопросы","Do/Does, Did, Wh-questions"],
 ["adjectives","✨","Прилагательные","Big, small, beautiful..."],
 ["adverbs","⚡","Наречия","Quickly, slowly..."],
 ["listening","🎧","Аудирование","Слушай и выбирай"],
 ["reading","📖","Чтение","Короткие тексты"],
 ["review","🔁","Повторение","Закрепление материала"]
];

const words=[
 ["apple","яблоко","🍎"],["book","книга","📖"],["cat","кошка","🐱"],["dog","собака","🐶"],["house","дом","🏠"],["school","школа","🎒"],["water","вода","💧"],["friend","друг","🧑‍🤝‍🧑"],["family","семья","👨‍👩‍👧"],["red","красный","🔴"],["blue","синий","🔵"],["green","зелёный","🟢"],["one","один","1️⃣"],["teacher","учитель","👩‍🏫"],["computer","компьютер","💻"],["food","еда","🍽️"]
];
const questions=[
 ["Choose the correct translation: apple","яблоко",["яблоко","стол","вода","дом"]],
 ["Choose the correct article: ___ apple","an",["a","an","the","—"]],
 ["Choose the correct sentence","I like English.",["I English like.","Like I English.","I like English.","English I like."]],
 ["Past of go","went",["goed","go","went","going"]],
 ["Present Continuous: She ___ now.","is reading",["read","reads","is reading","reading"]],
 ["Correct spelling","beautiful",["beautifull","beutiful","beautiful","beatiful"]],
 ["Meaning of under","под",["над","в","под","между"]],
 ["Choose pronoun for Anna","she",["he","she","it","they"]],
 ["Future: I ___ tomorrow.","will study",["studied","study","will study","am study"]],
 ["Question form","Do you like tea?",["You like tea?","Do you like tea?","Does you like tea?","Like you tea?"]]
];

function save(){localStorage.setItem("englishStartState",JSON.stringify(state))}
function login(){
 const l=loginName.value.trim(),p=loginPass.value;
 const acc=Object.values(accounts).find(a=>a.login===l&&a.pass===p);
 if(!acc){loginMsg.textContent="Неверный логин или пароль";loginMsg.style.color="#ff7888";return}
 current=acc; document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");
 userName.textContent=acc.name;avatar.textContent=acc.role==="teacher"?"T":"S";roleText.textContent=acc.role==="teacher"?"Панель педагога":"Личный кабинет ученика";
 buildNav();show("dashboard");
}
function logout(){current=null;document.getElementById("app").classList.add("hidden");document.getElementById("login").classList.remove("hidden")}
function buildNav(){
 const nav=document.getElementById("nav");
 nav.innerHTML=current.role==="teacher"
 ? `<button onclick="show('teacher')">📊 Ученики</button><button onclick="show('assign')">📝 Задания</button><button onclick="show('materials')">📚 Материалы</button><button onclick="show('analytics')">📈 Аналитика</button><button onclick="show('profile')">👤 Профиль</button>`
 : `<button onclick="show('dashboard')">🏠 Главная</button><button onclick="show('topics')">📚 Все темы</button><button onclick="show('test')">🧪 Микро-тест</button><button onclick="show('practice')">🎯 Практика</button><button onclick="show('dictionary')">📖 Словарик</button><button onclick="show('progress')">📈 Прогресс</button><button onclick="show('achievements')">🏆 Достижения</button><button onclick="show('profile')">👤 Профиль</button>`;
}
function show(page){
 pageTitle.textContent=page;
 document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
 const c=document.getElementById("content");
 if(page==="dashboard")c.innerHTML=dashboard();
 if(page==="topics")c.innerHTML=topicsPage();
 if(page==="test")c.innerHTML=testPage();
 if(page==="practice")c.innerHTML=practice();
 if(page==="dictionary")c.innerHTML=dictionary();
 if(page==="progress")c.innerHTML=progress();
 if(page==="achievements")c.innerHTML=achievements();
 if(page==="profile")c.innerHTML=profile();
 if(page==="teacher")c.innerHTML=teacher();
 if(page==="assign")c.innerHTML=assign();
 if(page==="materials")c.innerHTML=materials();
 if(page==="analytics")c.innerHTML=analytics();
}
function dashboard(){
 return `<div class="grid">
 <div class="card"><div class="muted">Уровень</div><div class="stat">A1</div><div class="muted">Beginner</div></div>
 <div class="card"><div class="muted">XP</div><div class="stat">${state.xp}</div><div class="muted">до следующего уровня ${200-state.xp}</div></div>
 <div class="card"><div class="muted">Серия</div><div class="stat">🔥 ${state.streak}</div><div class="muted">дня подряд</div></div>
 <div class="card"><div class="muted">Слов изучено</div><div class="stat">${state.words}</div><div class="muted">цель: 100</div></div></div>
 <div class="grid2" style="margin-top:18px"><div class="card"><h2>Продолжить обучение</h2><p class="muted">Начни с теста, чтобы определить стартовый уровень.</p><div class="actions"><button class="btn" onclick="show('test')">Пройти тест</button><button class="btn secondary" onclick="show('topics')">Все темы</button></div></div>
 <div class="card"><h2>Сегодня</h2><p>🎯 5 слов · 🧩 3 предложения · 🎧 1 упражнение</p><div class="bar"><i style="width:45%"></i></div><p class="muted">45% дневной цели</p></div></div>`;
}
function topicsPage(){return `<div class="grid">${topics.map(t=>`<div class="card topic"><div class="emoji">${t[1]}</div><h3>${t[2]}</h3><p class="muted">${t[3]}</p><button class="btn secondary" onclick="practiceTopic('${t[0]}')">Начать</button></div>`).join("")}</div>`}
function practiceTopic(id){state.xp+=10;save();alert("Тема открыта: "+id+"\\n+10 XP за начало занятия");show("practice")}
function testPage(){return `<div class="card"><h2>Диагностический микро-тест</h2><p class="muted">10 вопросов. После завершения система покажет примерный уровень.</p><div id="quiz"></div></div>`}
let qi=0,score=0;
function startQuiz(){qi=0;score=0;renderQ()}
function renderQ(){
 if(qi>=questions.length){let level=score<=3?"Beginner":score<=6?"Elementary":score<=8?"Pre-Intermediate":"Intermediate";state.tests++;state.xp+=score*10;save();content.innerHTML=`<div class="card"><h1>Тест завершён 🎉</h1><p>Результат: <b>${score}/10</b></p><h2>Примерный уровень: ${level}</h2><p class="muted">Это стартовая оценка, а не официальный экзамен.</p><button class="btn" onclick="show('topics')">Перейти к обучению</button></div>`;return}
 let q=questions[qi];content.innerHTML=`<div class="card"><span class="tag">Вопрос ${qi+1} / 10</span><h2>${q[0]}</h2><div class="options">${q[2].map(o=>`<button onclick="answer('${o.replace(/'/g,"\\'")}')">${o}</button>`).join("")}</div></div>`
}
function answer(o){if(o===questions[qi][1])score++;qi++;renderQ()}
function practice(){return `<div class="grid2"><div class="card"><h2>🧩 Sentence Builder</h2><p>Собери: <b>like / I / English</b></p><div class="actions"><button class="btn secondary" onclick="alert('Правильно: I like English.')">I</button><button class="btn secondary" onclick="alert('Продолжай!')">like</button><button class="btn secondary" onclick="alert('Продолжай!')">English</button></div></div><div class="card"><h2>🎧 Listen & Choose</h2><p>Нажми Listen и выбери услышанное слово.</p><button class="btn" onclick="speak('apple')">🔊 Listen</button><div class="options"><button onclick="alert('Правильно! +10 XP');state.xp+=10;save()">apple</button><button onclick="alert('Попробуй ещё раз')">house</button></div></div><div class="card"><h2>📚 Articles</h2><p>A — перед согласным звуком, An — перед гласным, The — конкретный предмет.</p><button class="btn" onclick="alert('Example: an apple, a book, the sun')">Примеры</button></div><div class="card"><h2>⏱️ Tenses</h2><p>Present Simple · Present Continuous · Past Simple · Future Simple</p><button class="btn" onclick="alert('I work. I am working. I worked. I will work.')">Показать примеры</button></div></div>`}
function speak(text){if("speechSynthesis"in window)speechSynthesis.speak(new SpeechSynthesisUtterance(text));else alert(text)}
function dictionary(){return `<div class="card"><input class="search" placeholder="Поиск слова..." oninput="filterWords(this.value)"><div id="wordList" class="grid">${words.map((w,i)=>wordCard(w,i)).join("")}</div></div>`}
function wordCard(w,i){return `<div class="item"><div class="emoji">${w[2]}</div><h2>${w[0]}</h2><p>${w[1]}</p><button class="btn secondary" onclick="speak('${w[0]}')">🔊</button> <button class="btn" onclick="addWord('${w[0]}')">+ Мои слова</button></div>`}
function filterWords(q){wordList.innerHTML=words.filter(w=>(w[0]+" "+w[1]).toLowerCase().includes(q.toLowerCase())).map((w,i)=>wordCard(w,i)).join("")}
function addWord(w){if(!state.myWords.includes(w)){state.myWords.push(w);state.words++;state.xp+=5;save();alert(w+" добавлено в словарик · +5 XP")}}
function progress(){return `<div class="grid2"><div class="card"><h2>Прогресс</h2><p>XP: <b>${state.xp}</b></p><div class="bar"><i style="width:${Math.min(100,state.xp/2)}%"></i></div><p>Изучено слов: <b>${state.words}</b></p><p>Пройдено тестов: <b>${state.tests}</b></p></div><div class="card"><h2>Темы</h2>${topics.slice(0,12).map((t,i)=>`<p>${t[1]} ${t[2]} <span class="tag">${Math.min(100,(i*11+23)%101)}%</span></p>`).join("")}</div></div>`}
function achievements(){let a=[["🎯","Первый тест",state.tests>=1],["📖","10 слов",state.words>=10],["🔥","3 дня",state.streak>=3],["⭐","250 XP",state.xp>=250],["🧠","20 слов",state.words>=20],["🏆","500 XP",state.xp>=500]];return `<div class="grid">${a.map(x=>`<div class="card"><div class="emoji">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]?"Разблокировано":"Ещё впереди"}</p></div>`).join("")}</div>`}
function profile(){return `<div class="grid2"><div class="card"><h2>👤 ${current.name}</h2><p>Роль: ${current.role==="teacher"?"Педагог":"Ученик"}</p><p>Логин: ${current.login}</p><p class="muted">Данные демо-хранятся локально в браузере.</p></div><div class="card"><h2>Настройки</h2><button class="btn secondary" onclick="document.body.style.background=document.body.style.background===''?'#f3f6fb':''">Сменить фон</button></div></div>`}
function teacher(){return `<div class="grid"><div class="card"><div class="muted">Учеников</div><div class="stat">12</div></div><div class="card"><div class="muted">Активных</div><div class="stat">9</div></div><div class="card"><div class="muted">Заданий</div><div class="stat">38</div></div><div class="card"><div class="muted">Средний результат</div><div class="stat">82%</div></div></div><div class="card" style="margin-top:18px"><h2>Список учеников</h2><table class="table"><tr><th>Ученик</th><th>Уровень</th><th>Прогресс</th><th>Последняя активность</th></tr><tr><td>Alex</td><td>A1</td><td>64%</td><td>Сегодня</td></tr><tr><td>Maria</td><td>A2</td><td>81%</td><td>Сегодня</td></tr><tr><td>Daniel</td><td>B1</td><td>73%</td><td>Вчера</td></tr></table></div>`}
function assign(){return `<div class="grid2"><div class="card"><h2>Создать задание</h2><label>Тема</label><select><option>Артикли</option><option>Времена</option><option>Словарик</option><option>Предложения</option></select><label>Ученик</label><select><option>Alex</option><option>Maria</option><option>Daniel</option></select><button class="btn" onclick="alert('Задание создано и назначено ученику')">Назначить</button></div><div class="card"><h2>Активные задания</h2><div class="list"><div class="item">Артикли · Alex · 0/10</div><div class="item">Past Simple · Maria · 8/10</div><div class="item">Vocabulary · Daniel · 15/20</div></div></div></div>`}
function materials(){return `<div class="grid">${topics.slice(0,15).map(t=>`<div class="card"><div class="emoji">${t[1]}</div><h3>${t[2]}</h3><p class="muted">${t[3]}</p><button class="btn secondary" onclick="alert('Материал: ${t[2]}')">Открыть</button></div>`).join("")}</div>`}
function analytics(){return `<div class="grid2"><div class="card"><h2>📈 Общая успеваемость</h2><div class="stat">82%</div><p class="muted">Средний результат учеников</p><div class="bar"><i style="width:82%"></i></div></div><div class="card"><h2>🔥 Активность</h2><p>Пн ████████</p><p>Вт ██████████</p><p>Ср ██████</p><p>Чт █████████</p><p>Пт ███████</p></div></div>`}

document.addEventListener("click",e=>{if(e.target.tagName==="BUTTON"&&e.target.closest(".nav")){}});
function init(){loginName.focus();document.querySelector("#login button").addEventListener("click",startQuizIfTest)}
function startQuizIfTest(){if(current===null)return; if(pageTitle.textContent==="test")startQuiz()}
loginName.addEventListener("keydown",e=>{if(e.key==="Enter")login()});loginPass.addEventListener("keydown",e=>{if(e.key==="Enter")login()});
</script>
</body>
</html>
