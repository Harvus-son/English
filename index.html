<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Start</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--accent:#635bff;--accent2:#8b5cf6;--line:#e8eaf0;--good:#16a34a;--bad:#dc2626;--shadow:0 14px 40px rgba(28,32,56,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:250px;background:rgba(255,255,255,.9);border-right:1px solid var(--line);padding:24px 16px;position:fixed;inset:0 auto 0 0;z-index:5}.logo{font-weight:800;font-size:23px;padding:8px 12px 24px}.logo span{color:var(--accent)}.nav button{display:block;width:100%;text-align:left;background:none;padding:13px 14px;border-radius:12px;color:#596174;margin:4px 0}.nav button.active,.nav button:hover{background:#eeecff;color:var(--accent);font-weight:700}.main{margin-left:250px;width:calc(100% - 250px);padding:34px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.pill{background:#eeecff;color:var(--accent);padding:8px 12px;border-radius:999px;font-weight:700;font-size:13px}.hero{background:linear-gradient(135deg,#635bff,#8b5cf6);color:white;border-radius:26px;padding:32px;box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:20px;overflow:hidden}.hero h1{font-size:34px;margin:0 0 10px}.hero p{max-width:650px;opacity:.9}.hero .orb{font-size:90px;align-self:center}.btn{background:var(--accent);color:white;padding:12px 17px;border-radius:12px;font-weight:700}.btn.light{background:white;color:var(--accent)}.btn.ghost{background:#f0efff;color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}.stat b{font-size:28px;display:block;margin-top:7px}.muted{color:var(--muted);font-size:14px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}.section-title h2{margin:0}.progress{height:9px;background:#eceef4;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.path{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.lesson{position:relative}.lesson.locked{opacity:.55}.lesson .icon{font-size:34px}.lesson h3{margin:10px 0 5px}.tag{display:inline-block;font-size:12px;padding:5px 8px;border-radius:8px;background:#f1f3f8;color:#626b7d}.wordgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.word{text-align:center}.word .pic{font-size:58px;background:#f4f5fb;border-radius:16px;padding:18px}.word h3{margin:10px 0 3px}.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:12px;outline:none;background:white}.quiz{max-width:800px;margin:auto}.qbar{display:flex;justify-content:space-between;margin-bottom:15px}.option{display:block;width:100%;text-align:left;padding:16px;margin:10px 0;background:#f7f8fc;border:2px solid transparent;border-radius:14px}.option:hover{border-color:#c7c2ff}.option.correct{background:#eaf8ef;border-color:#5fc77c}.option.wrong{background:#fff0f0;border-color:#ef7777}.feedback{padding:14px;border-radius:12px;background:#f5f6fa;margin-top:14px}.hidden{display:none}.alphabet{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.letter{padding:18px;text-align:center;border-radius:15px;background:#f7f8fc}.letter b{font-size:27px;display:block}.achievement{display:flex;align-items:center;gap:14px}.badge{font-size:35px}.settings-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.path{grid-template-columns:repeat(2,1fr)}.wordgrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.side{width:70px;padding:12px 8px}.logo{font-size:0;text-align:center}.logo span{font-size:23px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:20px}.main{margin-left:70px;width:calc(100% - 70px);padding:18px}.hero{padding:24px}.hero .orb{display:none}.grid,.path,.wordgrid{grid-template-columns:1fr}.alphabet{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="logo">English <span>Start</span></div>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard">🏠 Dashboard</button>
    <button data-page="learning">📚 Learning</button>
    <button data-page="exercises">🧩 Exercises</button>
    <button data-page="dictionary">📖 Dictionary</button>
    <button data-page="review">🔄 Review</button>
    <button data-page="achievements">🏆 Achievements</button>
    <button data-page="progress">📊 Progress</button>
    <button data-page="settings">⚙️ Settings</button>
  </nav>
</aside>
<main class="main" id="main"></main>
</div>
<script>
const letters=[["A","Apple","🍎","/eɪ/"],["B","Ball","⚽","/biː/"],["C","Cat","🐱","/siː/"],["D","Dog","🐶","/diː/"],["E","Egg","🥚","/iː/"],["F","Fish","🐟","/ef/"],["G","Green","🟢","/dʒiː/"],["H","House","🏠","/eɪtʃ/"],["I","Ice","🧊","/aɪ/"],["J","Juice","🧃","/dʒeɪ/"],["K","Key","🔑","/keɪ/"],["L","Lion","🦁","/el/"]];
const words=[["Dog","Собака","🐶","/dɒɡ/","Animals"],["Cat","Кошка","🐱","/kæt/","Animals"],["Apple","Яблоко","🍎","/ˈæpəl/","Food"],["Pizza","Пицца","🍕","/ˈpiːtsə/","Food"],["House","Дом","🏠","/haʊs/","Home"],["Car","Машина","🚗","/kɑːr/","Transport"],["Book","Книга","📚","/bʊk/","School"],["Sun","Солнце","☀️","/sʌn/","Nature"],["Blue","Синий","🔵","/bluː/","Colors"],["Family","Семья","👨‍👩‍👧","/ˈfæməli/","Family"],["Shirt","Рубашка","👕","/ʃɜːrt/","Clothes"],["Teacher","Учитель","🧑‍🏫","/ˈtiːtʃər/","Jobs"]];
const lessons=[
["alphabet","🅰️","Alphabet","Изучаем буквы, звуки и первые слова","Beginner",100],
["words","📚","Basic Words","Базовые слова по категориям","Beginner",65],
["sentences","🧩","Sentence Builder","Учимся строить простые предложения","Beginner",30],
["articles","🔤","Articles","A, An и The на понятных примерах","Elementary",0],
["spelling","✍️","Spelling","Правильное написание английских слов","Elementary",0],
["tenses","⏰","English Tenses","Present, Past и Future","Elementary",0]
];
let state=JSON.parse(localStorage.getItem("englishStart")||"null")||{page:"dashboard",xp:0,words:0,lessons:0,correct:0,streak:1,level:"Beginner",theme:"light",testDone:false};
function save(){localStorage.setItem("englishStart",JSON.stringify(state))}
function speak(text){if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang="en-US";speechSynthesis.speak(u)}}
function setPage(p){state.page=p;save();render()}
function stats(){return `<div class="grid"><div class="card stat"><span class="muted">Мой уровень</span><b>${state.level}</b></div><div class="card stat"><span class="muted">XP</span><b>${state.xp}</b></div><div class="card stat"><span class="muted">Правильных ответов</span><b>${state.correct}</b></div><div class="card stat"><span class="muted">🔥 Серия дней</span><b>${state.streak}</b></div></div>`}
function dashboard(){return `<div class="top"><div><span class="pill">ENGLISH START</span><h2>Личный кабинет</h2></div><button class="btn ghost" onclick="setPage('settings')">Настройки</button></div>
<div class="hero"><div><h1>Hello! 👋</h1><p>Изучай английский постепенно: проходи уроки, тренируй слова, собирай XP и отслеживай свой прогресс.</p><button class="btn light" onclick="setPage('${state.testDone?'learning':'test'}')">${state.testDone?'Продолжить обучение →':'Пройти микро-тест →'}</button></div><div class="orb">📖</div></div>${stats()}
<div class="section-title"><h2>Продолжить обучение</h2><button class="btn ghost" onclick="setPage('learning')">Все темы</button></div>
<div class="card"><div style="display:flex;justify-content:space-between"><b>Alphabet</b><span class="muted">100%</span></div><div class="progress" style="margin:12px 0"><i style="width:100%"></i></div><span class="muted">Буквы, произношение и первые слова</span></div>
<div class="section-title"><h2>Today's Challenge</h2></div><div class="card"><b>Learn 5 new words</b><p class="muted">Открой словарик и добавь новые слова в My Words.</p><button class="btn" onclick="setPage('dictionary')">Начать +50 XP</button></div>`}
function learning(){return `<div class="top"><div><span class="pill">LEARNING PATH</span><h2>Путь обучения</h2></div></div><div class="path">${lessons.map((l,i)=>`<div class="card lesson ${i>2?'locked':''}"><div class="icon">${l[1]}</div><span class="tag">${l[4]}</span><h3>${l[2]}</h3><p class="muted">${l[3]}</p><div class="progress"><i style="width:${l[5]}%"></i></div><p><b>${l[5]}%</b></p><button class="btn ${i>2?'ghost':''}" onclick="openLesson('${l[0]}')">${i>2?'Скоро':'Открыть →'}</button></div>`).join("")}</div>`}
function openLesson(id){if(id==="alphabet")setPage("alphabet");else if(id==="words")setPage("dictionary");else if(id==="sentences")setPage("sentences");else if(id==="articles")setPage("articles");else if(id==="spelling")setPage("spelling");else if(id==="tenses")setPage("tenses")}
function alphabet(){return `<div class="top"><div><span class="pill">BEGINNER</span><h2>Alphabet</h2></div><button class="btn" onclick="setPage('test')">Мини-тест</button></div><div class="card"><h2>A–Z</h2><p class="muted">Нажми на букву, чтобы услышать её. Изучай букву вместе с примером слова.</p><div class="alphabet">${letters.map(x=>`<button class="letter" onclick="speak('${x[0]}')"><b>${x[0]} ${x[0].toLowerCase()}</b><span>${x[1]} ${x[2]}</span><small>${x[3]}</small></button>`).join("")}</div></div>`}
function dictionary(){return `<div class="top"><div><span class="pill">VOCABULARY</span><h2>My Dictionary</h2></div></div><input class="search" id="search" placeholder="Поиск слова или перевода..." oninput="filterWords()"><div class="wordgrid" id="wordgrid" style="margin-top:18px">${wordCards(words)}</div>`}
function wordCards(arr){return arr.map(w=>`<div class="card word"><div class="pic">${w[2]}</div><h3>${w[0]}</h3><div class="muted">${w[1]}</div><small>${w[3]} · ${w[4]}</small><p><button class="btn ghost" onclick="speak('${w[0]}')">🔊 Listen</button></p><button class="btn" onclick="addWord('${w[0]}')">⭐ ${state.savedWords?.includes(w[0])?'Добавлено':'My Words'}</button></div>`).join("")}
function filterWords(){let q=document.getElementById("search").value.toLowerCase();document.getElementById("wordgrid").innerHTML=wordCards(words.filter(w=>w.join(" ").toLowerCase().includes(q)))}
function addWord(w){state.savedWords=state.savedWords||[];if(!state.savedWords.includes(w)){state.savedWords.push(w);state.words++;state.xp+=5;save();render()}}
function sentences(){return `<div class="top"><div><span class="pill">PRACTICE</span><h2>Sentence Builder</h2></div></div><div class="card quiz"><h2>Собери предложение</h2><p class="muted">Нажми на слова в правильном порядке.</p><div id="sentenceWords" style="display:flex;gap:10px;flex-wrap:wrap;margin:20px 0">${["I","like","pizza"].map(x=>`<button class="btn ghost" onclick="pickWord(this,'${x}')">${x}</button>`).join("")}</div><div class="card" id="sentenceResult">Твой ответ: <b id="sentenceAnswer"></b></div><button class="btn" onclick="checkSentence()">Проверить</button></div>`}
let sentenceAns=[];
function pickWord(btn,w){if(!sentenceAns.includes(w)){sentenceAns.push(w);btn.disabled=true;document.getElementById("sentenceAnswer").textContent=sentenceAns.join(" ")}}
function checkSentence(){let ok=sentenceAns.join(" ")==="I like pizza";document.getElementById("sentenceResult").innerHTML=ok?"<b>✅ Правильно!</b><p>Базовый порядок: Subject + Verb + Object.</p>":"<b>Попробуй ещё раз.</b>";if(ok){state.xp+=20;state.correct++;save()}}
function articles(){return `<div class="card quiz"><span class="pill">GRAMMAR</span><h2>Articles — A / An / The</h2><p>Артикль <b>a</b> используется перед согласным звуком, <b>an</b> — перед гласным звуком. <b>The</b> используется, когда речь идёт о конкретном предмете.</p><div class="card"><h3>I have ___ apple.</h3><button class="option" onclick="articleAnswer(this,false)">a</button><button class="option" onclick="articleAnswer(this,true)">an</button><button class="option" onclick="articleAnswer(this,false)">the</button></div><div id="articleFeedback"></div></div>`}
function articleAnswer(el,ok){document.querySelectorAll(".option").forEach(x=>x.disabled=true);el.classList.add(ok?"correct":"wrong");document.getElementById("articleFeedback").innerHTML=`<div class="feedback">${ok?"✅ An используется перед гласным звуком в apple.":"❌ Здесь нужен другой артикль. Подумай о первом звуке слова apple."}</div>`;if(ok){state.xp+=10;state.correct++;save()}}
function spelling(){return `<div class="card quiz"><span class="pill">SPELLING</span><h2>Spelling</h2><div style="font-size:80px;text-align:center">🍎</div><h3>Как правильно написать слово?</h3>${["Aple","Apple","Appel","Appl"].map(x=>`<button class="option" onclick="spell(this,'${x}')">${x}</button>`).join("")}<div id="spellFeedback"></div></div>`}
function spell(el,x){document.querySelectorAll(".option").forEach(b=>b.disabled=true);let ok=x==="Apple";el.classList.add(ok?"correct":"wrong");document.getElementById("spellFeedback").innerHTML=`<div class="feedback">${ok?"✅ Apple — правильное написание.":"❌ Правильное написание: Apple."}</div>`;if(ok){state.xp+=10;state.correct++;save()}}
function tenses(){return `<div class="card"><span class="pill">GRAMMAR</span><h2>English Tenses</h2><div class="path">${[["Present Simple","I play.","Регулярные действия"],["Present Continuous","I am playing.","Действие происходит сейчас"],["Past Simple","I played.","Действие в прошлом"],["Future Simple","I will play.","Действие в будущем"]].map(x=>`<div class="card"><h3>${x[0]}</h3><b>${x[1]}</b><p class="muted">${x[2]}</p></div>`).join("")}</div></div>`}
const quizQs=[
["Choose the correct word: I ___ a student.","am","is","are","be","am"],
["Как переводится Apple?","Яблоко","Апельсин","Банан","Груша","Яблоко"],
["Choose the correct article: ___ cat.","a","an","the","—","a"],
["Which spelling is correct?","Aple","Apple","Appel","Appl","Apple"],
["Choose the correct sentence.","I student am.","Am I student a.","I am a student.","I a am student.","I am a student"]
];
let qi=0,qscore=0;
function test(){if(qi>=quizQs.length){let s=qscore;state.testDone=true;state.correct+=s;state.xp+=s*20;state.level=s<=1?"Beginner":s<=3?"Elementary":s===4?"Pre-Intermediate":"Strong Start";save();return `<div class="card quiz"><h1>Тест завершён!</h1><h2>${s}/${quizQs.length}</h2><p>Твой стартовый уровень: <b>${state.level}</b></p><button class="btn" onclick="setPage('learning')">Начать обучение →</button></div>`}let q=quizQs[qi];return `<div class="card quiz"><div class="qbar"><b>Вопрос ${qi+1}/${quizQs.length}</b><span>${qscore} правильных</span></div><div class="progress"><i style="width:${qi/quizQs.length*100}%"></i></div><h2 style="margin-top:28px">${q[0]}</h2>${q.slice(1,5).map((x,i)=>`<button class="option" onclick="answerQuiz(this,'${x.replace(/'/g,"\\'")}','${q[5].replace(/'/g,"\\'")}')">${x}</button>`).join("")}<div id="quizFeedback"></div></div>`}
function answerQuiz(el,x,right){document.querySelectorAll(".option").forEach(b=>b.disabled=true);let ok=x===right;el.classList.add(ok?"correct":"wrong");if(ok)qscore++;document.getElementById("quizFeedback").innerHTML=`<div class="feedback">${ok?"✅ Отлично!":"❌ Правильный ответ: "+right}</div><button class="btn" style="margin-top:12px" onclick="qi++;render()">Далее →</button>`}
function exercises(){return `<div class="card"><h2>Exercises</h2><p class="muted">Выбери тренировку.</p><div class="path"><button class="card" onclick="setPage('sentences')"><h3>🧩 Sentence Builder</h3><p>Собирай предложения.</p></button><button class="card" onclick="setPage('spelling')"><h3>✍️ Spelling</h3><p>Тренируй написание слов.</p></button><button class="card" onclick="setPage('articles')"><h3>🔤 Articles</h3><p>Практикуй A, An, The.</p></button></div></div>`}
function review(){let saved=state.savedWords||[];return `<div class="card"><span class="pill">REVIEW</span><h2>Повторение</h2><p class="muted">Слова из My Words: ${saved.length}</p>${saved.length?`<div class="wordgrid">${wordCards(words.filter(w=>saved.includes(w[0])))}</div>`:"<p>Добавь слова в словарике, чтобы они появились здесь.</p>"}</div>`}
function achievements(){let a=[["🏆","First Lesson",state.lessons>0||state.testDone],["⭐","10 Words",state.words>=10],["📚","100 Words",state.words>=100],["🔥","7 Day Streak",state.streak>=7],["💯","Perfect Test",state.testDone&&state.correct>=5],["🅰️","Alphabet Master",true]];return `<div class="card"><h2>Achievements</h2>${a.map(x=>`<div class="settings-row achievement" style="opacity:${x[2]?1:.4}"><span class="badge">${x[0]}</span><div><b>${x[1]}</b><div class="muted">${x[2]?"Unlocked":"Locked"}</div></div></div>`).join("")}</div>`}
function progress(){return `<div class="card"><h2>My Progress</h2><p>Level: <b>${state.level}</b></p><p>XP: <b>${state.xp}</b> / 1500</p><div class="progress"><i style="width:${Math.min(100,state.xp/15)}%"></i></div>${[["Alphabet",100],["Words",Math.min(100,state.words*10)],["Grammar",state.testDone?35:0]].map(x=>`<div style="margin-top:22px"><div style="display:flex;justify-content:space-between"><b>${x[0]}</b><span>${x[1]}%</span></div><div class="progress"><i style="width:${x[1]}%"></i></div></div>`).join("")}</div>`}
function settings(){return `<div class="card"><h2>Settings</h2><div class="settings-row"><div><b>Theme</b><div class="muted">Light / Dark</div></div><button class="btn ghost" onclick="toggleTheme()">Переключить</button></div><div class="settings-row"><div><b>Сбросить прогресс</b><div class="muted">Удалить сохранённые результаты</div></div><button class="btn" onclick="resetData()">Сбросить</button></div></div>`}
function toggleTheme(){if(state.theme==="light"){document.documentElement.style.setProperty("--bg","#10131c");document.documentElement.style.setProperty("--card","#191d28");document.documentElement.style.setProperty("--text","#f3f4f6");document.documentElement.style.setProperty("--muted","#a5adbd");state.theme="dark"}else{location.reload()}save()}
function resetData(){localStorage.removeItem("englishStart");location.reload()}
function render(){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page));let p=state.page;let out={dashboard,learning,alphabet,dictionary,sentences,articles,spelling,tenses,exercises,review,achievements,progress,settings,test}[p]||dashboard;document.getElementById("main").innerHTML=out();if(state.theme==="dark"){document.documentElement.style.setProperty("--bg","#10131c");document.documentElement.style.setProperty("--card","#191d28");document.documentElement.style.setProperty("--text","#f3f4f6");document.documentElement.style.setProperty("--muted","#a5adbd")}}
document.getElementById("nav").addEventListener("click",e=>{let b=e.target.closest("button");if(b)setPage(b.dataset.page)});
render();
</script>
</body></html>
