</nav></aside><main><header class="topbar"><div><span class="eyebrow">PRIVATE WORKSPACE</span><h1>Мои материалы</h1></div></header><section class="section-intro"><h2>✍️ Пиши и рисуй свои заметки</h2><p>Текст и рисунок сохраняются локально в этом браузере.</p></section><div class="self-grid"><article class="content-card"><h3>📝 Текст</h3><textarea id="privateNotes" class="private-notes" placeholder="Например: добавить в урок правило, пример, домашнее задание..."></textarea><button id="saveNotes" class="small-button">Сохранить текст</button><span id="notesStatus" class="save-status"></span></article><article class="content-card"><h3>🎨 Рисование</h3><canvas id="noteCanvas" class="note-canvas" width="700" height="420"></canvas><div class="input-row"><button id="clearCanvas" class="small-button">Очистить</button><button id="saveCanvas" class="small-button">Сохранить рисунок</button></div></article></div><a class="next-button link-button" href="./topics.html">← К темам</a></section></main></div><script src="./app.js"></script><script>const n=document.querySelector('#privateNotes');n.value=localStorage.getItem('private_notes')||'';document.querySelector('#saveNotes').onclick=()=>{localStorage.setItem('private_notes',n.value);document.querySelector('#notesStatus').textContent='✓ Сохранено';};const c=document.querySelector('#noteCanvas'),x=c.getContext('2d');x.lineWidth=3;x.lineCap='round';let draw=false;c.onpointerdown=e=>{draw=true;x.beginPath();x.moveTo(e.offsetX,e.offsetY)};c.onpointerup=()=>draw=false;c.onpointerleave=()=>draw=false;c.onpointermove=e=>{if(draw){x.lineTo(e.offsetX,e.offsetY);x.stroke()}};document.querySelector('#clearCanvas').onclick=()=>x.clearRect(0,0,c.width,c.height);document.querySelector('#saveCanvas').onclick=()=>{localStorage.setItem('private_drawing',c.toDataURL());alert('Рисунок сохранён');};const saved=localStorage.getItem('private_drawing');if(saved){const img=new Image();img.onload=()=>x.drawImage(img,0,0);img.src=saved;}</script></body></html>
